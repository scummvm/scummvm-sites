[project]
name = "buildbot-director"
version = "0.2.0"
description = "Buildbot for scummvms director tests"
authors = [{ name = "Roland van Laar", email = "roland@micite.net" }]
requires-python = ">=3.10,<4"
dependencies = [
  "environs",
  "treq",
  "buildbot[bundle]<4.4.0",
  "psycopg2>=2.9.5,<3.0.0",
  "certifi",
  "Pillow>=10.0.0",
  "flask>=3.0.0",
]

[dependency-groups]
dev = [
  "isort",
  "mypy",
  "pylint",
  "black",
  "ipdb",
]

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director"]
