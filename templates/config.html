<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title {
            margin-top: 8vh;
            text-align: center;
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            align-self: flex-start;
            margin-left: 2vh;
        }

        .main {
            height: 90vh;
            width: 100vw;
        }

        .config-section {
            margin-bottom: 30px;
            padding: 25px;
            padding-left: 50px;
            padding-right: 50px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            width: 100%;
            box-sizing: border-box;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            gap: 10px;
        }

        .config-item label {
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }

        .current-value {
            font-style: italic;
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .submit-section {
            padding: 20px 0;
            border-top: 1px solid #ddd;
            margin-top: 20px;
        }

        .config-item input,
        .config-item select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        @media (max-width: 768px) {
            .config {
                font-size: 40px;
            }
        }

        @media (max-width: 480px) {
            .config {
                font-size: 32px;
            }

            nav {
                padding: 10px;
            }

            .nav-buttons a {
                margin-bottom: 5px;
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='integrity_service_logo_256.png') }}" alt="Logo">
            </a>
        </div>
        <div class="nav-buttons">
            <a href="{{ url_for('user_games_list') }}">User Games List</a>
            <a href="{{ url_for('ready_for_review') }}">Ready for review</a>
            <a href="{{ url_for('fileset_search') }}">Fileset Search</a>
            <a href="{{ url_for('logs', sort='id-desc')}}">Logs</a>
            <a href="{{ url_for('config') }}">Config</a>
        </div>
    </nav>
    <div class="content">
        <h1 class="title">User Configurations</h1>
        <div class="main">
            <form class="config-form" method="POST" action="{{ url_for('config') }}">
                <div class="config-section">
                    <div class="config-item">
                        <label for="filesets_per_page">Number of filesets per page:</label>
                        <div class="input-container">
                            <input type="number" name="filesets_per_page" id="filesets_per_page" value="{{ filesets_per_page }}"
                                min="1">
                            <div class="current-value">Default: 25</div>
                        </div>
                        <label for="logs_per_page">Number of logs per page:</label>
                        <div class="input-container">
                            <input type="number" name="logs_per_page" id="logs_per_page" value="{{ logs_per_page }}"
                                min="1">
                            <div class="current-value">Default: 25</div>
                        </div>
                    </div>
                    <div class="submit-section">
                        <button type="submit">Save Configuration</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('filesets_per_page').addEventListener('input', function () {
            const value = parseInt(this.value);
            if (value < 1) this.value = 1;
            if (value > 250) this.value = 250;
        });
        document.getElementById('logs_per_page').addEventListener('input', function () {
            const value = parseInt(this.value);
            if (value < 1) this.value = 1;
            if (value > 250) this.value = 250;
        });
    </script>
</body>

</html>
